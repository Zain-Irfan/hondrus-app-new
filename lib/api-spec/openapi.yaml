openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Honduran Products Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: categories
    description: Product categories
  - name: cart
    description: Shopping cart
  - name: orders
    description: Order management
  - name: account
    description: Customer account
  - name: store
    description: Store summary and featured data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: bestseller
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List product categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /store/featured:
    get:
      operationId: getFeaturedProducts
      tags: [store]
      summary: Get featured and bestselling products for homepage
      responses:
        "200":
          description: Featured products summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedSummary"

  /store/shipping-estimate:
    post:
      operationId: estimateShipping
      tags: [store]
      summary: Estimate shipping cost for UPS/FedEx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingEstimateRequest"
      responses:
        "200":
          description: Shipping estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingEstimateResponse"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      responses:
        "200":
          description: Current cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear cart
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{itemId}:
    put:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current customer or guest
      parameters:
        - name: guestToken
          in: query
          required: false
          description: Per-device guest token, used when no auth session is present.
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (checkout, guest or signed-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/claim:
    post:
      operationId: claimGuestOrders
      tags: [orders]
      summary: Attach a device's prior guest orders to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimGuestOrdersBody"
      responses:
        "200":
          description: Claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimGuestOrdersResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID (tracking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: guestToken
          in: query
          required: false
          description: Per-device guest token, used when no auth session is present.
          schema:
            type: string
      responses:
        "200":
          description: Order details with tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/profile:
    get:
      operationId: getProfile
      tags: [account]
      summary: Get customer profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
    put:
      operationId: updateProfile
      tags: [account]
      summary: Update customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        isBestseller:
          type: boolean
        isFeatured:
          type: boolean
        inStock:
          type: boolean
        stockQuantity:
          type: integer
        weight:
          type: number
        origin:
          type: string
        tags:
          type: array
          items:
            type: string
        rating:
          type: number
        reviewCount:
          type: integer
      required:
        - id
        - name
        - slug
        - description
        - price
        - imageUrl
        - categoryId
        - categoryName
        - isBestseller
        - isFeatured
        - inStock
        - stockQuantity
        - weight
        - origin
        - tags
        - rating
        - reviewCount

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        productCount:
          type: integer
      required:
        - id
        - name
        - slug
        - description
        - imageUrl
        - productCount

    FeaturedSummary:
      type: object
      properties:
        bestsellers:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        featured:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        newArrivals:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        totalProducts:
          type: integer
        totalCategories:
          type: integer
      required:
        - bestsellers
        - featured
        - newArrivals
        - totalProducts
        - totalCategories

    ShippingEstimateRequest:
      type: object
      properties:
        zipCode:
          type: string
        totalWeight:
          type: number
        orderSubtotal:
          type: number
      required:
        - zipCode
        - totalWeight
        - orderSubtotal

    ShippingEstimateResponse:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOption"
        freeShippingEligible:
          type: boolean
        freeShippingThreshold:
          type: number
      required:
        - options
        - freeShippingEligible
        - freeShippingThreshold

    ShippingOption:
      type: object
      properties:
        carrier:
          type: string
        service:
          type: string
        estimatedDays:
          type: integer
        price:
          type: number
      required:
        - carrier
        - service
        - estimatedDays
        - price

    CartItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productImageUrl:
          type: string
        price:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number
      required:
        - id
        - productId
        - productName
        - productImageUrl
        - price
        - quantity
        - subtotal

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        itemCount:
          type: integer
      required:
        - items
        - subtotal
        - itemCount

    AddToCartBody:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
      required:
        - productId
        - quantity

    UpdateCartItemBody:
      type: object
      properties:
        quantity:
          type: integer
      required:
        - quantity

    Order:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        shippingCost:
          type: number
        total:
          type: number
        shippingAddress:
          $ref: "#/components/schemas/Address"
        shippingCarrier:
          type: string
        trackingNumber:
          type: string
        estimatedDelivery:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - orderNumber
        - status
        - items
        - subtotal
        - shippingCost
        - total
        - shippingAddress
        - createdAt
        - updatedAt

    Address:
      type: object
      properties:
        fullName:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        phone:
          type: string
      required:
        - fullName
        - line1
        - city
        - state
        - zipCode
        - phone

    CreateOrderBody:
      type: object
      properties:
        shippingAddress:
          $ref: "#/components/schemas/Address"
        shippingOptionId:
          type: string
        customerEmail:
          type: string
        customerName:
          type: string
        guestToken:
          type: string
          description: Per-device guest token. Required when no auth session is present.
      required:
        - shippingAddress
        - shippingOptionId
        - customerEmail
        - customerName

    ClaimGuestOrdersBody:
      type: object
      properties:
        guestToken:
          type: string
      required:
        - guestToken

    ClaimGuestOrdersResponse:
      type: object
      properties:
        claimed:
          type: integer
      required:
        - claimed

    CustomerProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        defaultAddress:
          $ref: "#/components/schemas/Address"
        orderCount:
          type: integer
        joinedAt:
          type: string
      required:
        - id
        - name
        - email
        - orderCount
        - joinedAt

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        defaultAddress:
          $ref: "#/components/schemas/Address"
