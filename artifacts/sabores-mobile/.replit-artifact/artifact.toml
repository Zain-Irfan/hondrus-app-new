kind = "mobile"
previewPath = "/sabores-mobile/"
title = "Sabores de Honduras — App Móvil"
version = "1.0.0"
id = "artifacts/sabores-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/sabores-mobile/" ]
localPort = 21050

[services.development]
run = "pnpm --filter @workspace/sabores-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sabores-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sabores-mobile", "run", "serve" ]

[services.env]
PORT = "21050"
BASE_PATH = "/sabores-mobile/"
